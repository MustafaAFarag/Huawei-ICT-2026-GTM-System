packages:
  - apps/*
  - packages/*
  - twenty-app

minimumReleaseAgeExclude:
  - '@nestjs/common@12.1.3'
  - '@nestjs/core@12.1.3'
  - '@nestjs/platform-express@12.1.3'
  - bullmq@6.3.14
  - twenty-client-sdk@2.46.0
  - twenty-sdk@2.46.0
  - twenty-ui@2.46.0

saveExact: true
engineStrict: true
allowBuilds:
  '@nestjs/core': true
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  prisma: true
  sharp: true
  '@scarf/scarf': false
  msgpackr-extract: false
