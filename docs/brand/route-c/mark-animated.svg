<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100"><style>
#route{stroke-dasharray:166.16;stroke-dashoffset:166.16;animation:draw .6s cubic-bezier(.2,.8,.2,1) forwards}
#waypoint-1,#waypoint-2,#waypoint-3,#terminal{transform-box:fill-box;transform-origin:center;transform:scale(0);animation:pop .28s cubic-bezier(.3,1.6,.5,1) forwards}
#waypoint-1{animation-delay:.25s}#waypoint-2{animation-delay:.37s}#waypoint-3{animation-delay:.49s}#terminal{animation-delay:.62s}
@keyframes draw{to{stroke-dashoffset:0}}@keyframes pop{to{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){#route{animation:none;stroke-dashoffset:0}#waypoint-1,#waypoint-2,#waypoint-3,#terminal{animation:none;transform:none}}
</style><g transform="translate(0.000 0.000) scale(1.00000)"><path id="route" d="M76.046 28.145A34.0 34.0 0 1 0 76.046 71.855" fill="none" stroke="#3F5A45" stroke-width="14.0" stroke-linecap="round"/><circle id="waypoint-1" cx="38.371" cy="18.050" r="4.340" fill="#E8765A"/><circle id="waypoint-2" cx="16.000" cy="50.000" r="4.340" fill="#E8765A"/><circle id="waypoint-3" cx="38.371" cy="81.950" r="4.340" fill="#E8765A"/><circle id="terminal" cx="76.046" cy="71.855" r="10.500" fill="#E8765A"/></g></svg>
