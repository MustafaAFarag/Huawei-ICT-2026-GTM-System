name: Deploy reviewed Azure demo
on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Reviewed commit SHA (immutable image tag)
        required: true
      confirm:
        description: Type DEPLOY REVIEWED DEMO after reviewing the deployment package
        required: true
permissions:
  contents: read
  id-token: write
concurrency:
  group: revenue-azure-demo
  cancel-in-progress: false
jobs:
  deploy:
    if: inputs.confirm == 'DEPLOY REVIEWED DEMO'
    environment: azure-demo
    runs-on: ubuntu-latest
    steps:
      - name: Require an immutable reviewed commit
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          if ! [[ "$IMAGE_TAG" =~ ^[0-9a-f]{40}$ ]]; then
            echo "image_tag must be a full reviewed commit SHA."; exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.image_tag }}
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Build and push reviewed product images
        env:
          REGISTRY: ${{ vars.AZURE_REGISTRY }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          az acr login --name "$REGISTRY"
          for app in api worker web; do
            docker build -f infra/docker/Dockerfile --target "$app" -t "$REGISTRY.azurecr.io/revenue-$app:$IMAGE_TAG" .
            docker push "$REGISTRY.azurecr.io/revenue-$app:$IMAGE_TAG"
          done
      - name: Validate concrete deployment
        env:
          PARAMETERS: ${{ secrets.AZURE_DEPLOY_PARAMETERS }}
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          umask 077
          printf '%s' "$PARAMETERS" > "$RUNNER_TEMP/revenue-parameters.json"
          az bicep build --file infra/azure/main.bicep --outfile "$RUNNER_TEMP/revenue-template.json"
          az deployment group validate --resource-group "$RESOURCE_GROUP" --template-file infra/azure/main.bicep --parameters "@$RUNNER_TEMP/revenue-parameters.json" imageTag="$IMAGE_TAG"
          az deployment group what-if --resource-group "$RESOURCE_GROUP" --template-file infra/azure/main.bicep --parameters "@$RUNNER_TEMP/revenue-parameters.json" imageTag="$IMAGE_TAG"
      - name: Deploy approved package
        env:
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          az deployment group create --resource-group "$RESOURCE_GROUP" --template-file infra/azure/main.bicep --parameters "@$RUNNER_TEMP/revenue-parameters.json" imageTag="$IMAGE_TAG" --name "revenue-$IMAGE_TAG"
      - name: Run schema migration and provision demo owner
        env:
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          PREFIX: ${{ vars.AZURE_PREFIX }}
        run: |
          execution=$(az containerapp job start --resource-group "$RESOURCE_GROUP" --name "$PREFIX-migrate" --query name -o tsv)
          for attempt in $(seq 1 60); do
            status=$(az containerapp job execution show --resource-group "$RESOURCE_GROUP" --name "$PREFIX-migrate" --job-execution-name "$execution" --query properties.status -o tsv)
            if [ "$status" = Succeeded ]; then exit 0; fi
            if [ "$status" = Failed ]; then echo "Migration failed. Inspect the private job logs."; exit 1; fi
            sleep 10
          done
          echo "Migration did not complete within ten minutes."; exit 1
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - name: Install browser validation dependencies
        run: |
          corepack enable
          corepack prepare pnpm@12.10.1 --activate
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
      - name: Verify deployed demo with Playwright
        env:
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          IMAGE_TAG: ${{ inputs.image_tag }}
          DEMO_EMAIL: ${{ vars.DEMO_EMAIL }}
          DEMO_PASSWORD: ${{ secrets.DEMO_PASSWORD }}
          CHROME_PATH: playwright
        run: |
          export TEST_BASE_URL=$(az deployment group show --resource-group "$RESOURCE_GROUP" --name "revenue-$IMAGE_TAG" --query properties.outputs.productUrl.value -o tsv)
          test -n "$TEST_BASE_URL"
          pnpm test:e2e
      - name: Clean private parameter file
        if: always()
        run: rm -f "$RUNNER_TEMP/revenue-parameters.json"
